<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Lucas Nishimura. Segurança, automação e desenvolvimento assistido por IA.">
  <rect width="1200" height="300" fill="#EDEDE7"/>
  <rect x="0" y="0" width="1200" height="300" fill="none" stroke="#E3E3DB" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="244" fill="none" stroke="#CFCFC6" stroke-width="1"/>

  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace">
    <text x="80" y="86" font-size="14" letter-spacing="5" fill="#8A8F97" opacity="0">
      DOSSIÊ / GITHUB
      <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.7s" fill="freeze"/>
    </text>
  </g>

  <text x="80" y="168" font-family="'Iowan Old Style', 'Palatino Linotype', Georgia, 'Times New Roman', serif" font-size="64" font-weight="600" letter-spacing="-1" fill="#1A1D21" opacity="0">
    Lucas Nishimura
    <animate attributeName="opacity" from="0" to="1" begin="0.25s" dur="0.8s" fill="freeze"/>
  </text>

  <line x1="80" y1="196" x2="80" y2="196" stroke="#28518C" stroke-width="3" stroke-linecap="square">
    <animate attributeName="x2" from="80" to="560" begin="0.55s" dur="1s" fill="freeze"/>
  </line>

  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" opacity="0">
    <text x="80" y="236" font-size="19" fill="#5C6169">segurança da informação  ·  automação  ·  IA aplicada</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.9s" fill="freeze"/>
  </g>

  <g opacity="0">
    <circle cx="1020" cy="150" r="78" fill="none" stroke="#28518C" stroke-width="2" stroke-opacity="0.4"
            stroke-dasharray="432 58" transform="rotate(105 1020 150)"/>
    <text x="1020" y="172" text-anchor="middle" font-family="'Iowan Old Style', 'Palatino Linotype', Georgia, serif"
          font-size="62" font-weight="600" letter-spacing="-2" fill="#28518C">LN</text>
    <rect x="1012" y="221" width="16" height="16" fill="#3F6B4A"/>
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.9s" fill="freeze"/>
  </g>
</svg>
